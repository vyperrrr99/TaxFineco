# ============================================================
# Calcolo Tasse Fineco — Configurazione
# ============================================================

# Anno di imposta da calcolare (modificabile senza toccare il codice)
anno_imposta: 2025

# Cartella dove salvare i file di output
output_folder: "output"

# Colonne attese nel file Excel di Fineco
# Modifica qui se Fineco cambia i nomi delle colonne
colonne_attese:
  - "Data valuta"
  - "Descrizione"
  - "Titolo"
  - "Isin"
  - "Segno"
  - "Quantita"
  - "Divisa"
  - "Prezzo"
  - "Cambio"
  - "Controvalore"

# Tipi di operazione riconosciuti
# Equity: operazioni su azioni, ETF, bond, ETP
operazioni_equity:
  - "Compravendita titoli"
  - "Rimborso"
  - "Aumento capitale"

# CFD: operazioni su derivati (futures, CFD indici, forex, commodities)
# Aggiungi qui le stringhe esatte che compaiono nella colonna "Descrizione" del tuo Excel
operazioni_cfd:
  - "Compravendita CFD"
  - "Compravendita future"
  - "CFD"
  - "Futures"

# Soglia numerica per considerare una quantità "zero" (floating point safety)
epsilon: 1.0e-6

# Anno a partire dal quale verificare le vendite senza corrispondenza acquisto.
# Operazioni precedenti a questo anno non vengono controllate (lo storico pre-2025
# è considerato completo e già riconciliato).
isin_alias_check_from_anno: 2025

# ============================================================
# Movimentazione conto corrente (CFD / Derivati)
# ============================================================

# Colonne attese nel file Excel della movimentazione del conto Fineco.
# Il file ha struttura diversa dal file di movimentazione titoli.
colonne_conto_attese:
  - "Data valuta"
  - "Entrate"
  - "Descrizione"
  - "Descrizione Completa"

# Voci della colonna "Descrizione" che identificano movimenti CFD/derivati.
# Queste voci vengono usate per filtrare le righe rilevanti ai fini fiscali.
descrizioni_cfd_conto:
  - "Margine di variazione derivati"
  - "Oneri CFD"
  - "Proventi Societari CFD Long"
  - "Oneri Societari CFD Short"
